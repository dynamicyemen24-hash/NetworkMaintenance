<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الحسينية — تسجيل الدخول</title>
    <link rel="icon" href="../Branding/icon-32.png">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a365d;
            --secondary: #2d3748;
            --accent: #3182ce;
            --success: #38a169;
            --warning: #d69e2e;
            --danger: #e53e3e;
            --bg-gradient: linear-gradient(135deg, #1a365d 0%, #2d3748 50%, #1a365d 100%);
        }
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            text-align: center;
        }
        .logo-container {
            margin-bottom: 30px;
        }
        .logo-container img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .logo-container h1 {
            color: var(--primary);
            font-size: 28px;
            font-weight: 800;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        .logo-container p {
            color: var(--secondary);
            font-size: 14px;
            opacity: 0.8;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--secondary);
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-login:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .btn-login:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
        }
        .remember-me {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .remember-me label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--secondary);
            font-size: 14px;
        }
        .forgot-password {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .alert-success {
            background: #f0fff4;
            color: var(--success);
            border: 1px solid #c6f6d5;
        }
        .alert-danger {
            background: #fff5f5;
            color: var(--danger);
            border: 1px solid #fed7d7;
        }
        .alert-info {
            background: #ebf8ff;
            color: var(--accent);
            border: 1px solid #bee3f8;
        }
        .user-roles {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .user-roles h3 {
            color: var(--secondary);
            font-size: 16px;
            margin-bottom: 15px;
        }
        .role-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .role-card {
            background: #f7fafc;
            padding: 12px 8px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .role-card:hover {
            background: #edf2f7;
            border-color: var(--accent);
        }
        .role-card.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .role-card i {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .role-card div {
            font-size: 12px;
            font-weight: 600;
        }
        .footer {
            margin-top: 30px;
            color: var(--secondary);
            font-size: 12px;
            opacity: 0.7;
        }
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="../Branding/icon-64.png" alt="مكتبة الحسينية" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'80\' height=\'80\' viewBox=\'0 0 80 80\'><rect fill=\'%231a365d\' width=\'80\' height=\'80\' rx=\'20\'/><text x=\'50%\' y=\'50%\' font-size=\'36\' text-anchor=\'middle\' dy=\'.35em\' fill=\'white\'>م</text></svg>'">
            <h1>مكتبة الحسينية</h1>
            <p>نظام إدارة المكتبة المتكامل — Elias Pro</p>
        </div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="username"><i class="ti ti-user"></i> اسم المستخدم</label>
                <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password"><i class="ti ti-lock"></i> كلمة المرور</label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
            </div>

            <div class="remember-me">
                <label>
                    <input type="checkbox" id="rememberMe" checked>
                    تذكرني
                </label>
                <a href="#" class="forgot-password" onclick="showForgotPassword()">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="ti ti-login"></i>
                <span>تسجيل الدخول</span>
                <div class="loading-spinner" id="loadingSpinner"></div>
            </button>
        </form>

        <div id="alertBox" class="alert"></div>

        <div class="user-roles">
            <h3>الأدوار المتاحة</h3>
            <div class="role-cards">
                <div class="role-card" onclick="selectRole('admin')" data-role="admin">
                    <i class="ti ti-crown"></i>
                    <div>مدير النظام</div>
                </div>
                <div class="role-card" onclick="selectRole('librarian')" data-role="librarian">
                    <i class="ti ti-book"></i>
                    <div>أمين المكتبة</div>
                </div>
                <div class="role-card" onclick="selectRole('member')" data-role="member">
                    <i class="ti ti-user"></i>
                    <div>عضو</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>مكتبة الحسينية © 2026 — Elias Pro v6.0</p>
            <p>FixMaster Technology</p>
        </div>
    </div>

    <script>
        // User database for Al-Husseini Library
        const libraryUsers = [
            {
                id: 1,
                username: 'admin',
                password: 'admin123',
                fullName: 'مدير المكتبة',
                role: 'admin',
                department: 'الإدارة',
                email: 'admin@alhusseini-library.com',
                permissions: ['all']
            },
            {
                id: 2,
                username: 'librarian',
                password: 'lib123',
                fullName: 'أمين المكتبة الرئيسي',
                role: 'librarian',
                department: 'المكتبة',
                email: 'librarian@alhusseini-library.com',
                permissions: ['books', 'members', 'reports']
            },
            {
                id: 3,
                username: 'member',
                password: 'mem123',
                fullName: 'عضو جديد',
                role: 'member',
                department: 'الأعضاء',
                email: 'member@alhusseini-library.com',
                permissions: ['borrow', 'return']
            },
            {
                id: 4,
                username: 'ahmed',
                password: 'ahmed123',
                fullName: 'أحمد الحسيني',
                role: 'librarian',
                department: 'المكتبة',
                email: 'ahmed@alhusseini-library.com',
                permissions: ['books', 'members', 'reports']
            },
            {
                id: 5,
                username: 'fatima',
                password: 'fatima123',
                fullName: 'فاطمة الزهراء',
                role: 'librarian',
                department: 'الإعارة',
                email: 'fatima@alhusseini-library.com',
                permissions: ['borrow', 'return', 'members']
            },
            {
                id: 6,
                username: 'viewer',
                password: 'view123',
                fullName: 'مشاهد تجريبي',
                role: 'member',
                department: 'الأعضاء',
                email: 'viewer@alhusseini-library.com',
                permissions: ['borrow']
            }
        ];

        let selectedRole = 'member';

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Check if already logged in
            const token = localStorage.getItem('library_token');
            if (token) {
                try {
                    const payload = JSON.parse(atob(token));
                    if (payload.exp > Date.now()) {
                        redirectToDashboard(payload.role);
                        return;
                    }
                } catch (e) {
                    localStorage.removeItem('library_token');
                }
            }

            // Select default role
            selectRole('member');
        });

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-card').forEach(card => {
                card.classList.remove('active');
                if (card.dataset.role === role) {
                    card.classList.add('active');
                }
            });
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const alertBox = document.getElementById('alertBox');

            // Show loading
            loginBtn.disabled = true;
            loadingSpinner.style.display = 'inline-block';

            // Simulate API call delay
            setTimeout(() => {
                // Find user
                const user = libraryUsers.find(u => 
                    u.username === username && u.password === password
                );

                if (user) {
                    // Create JWT-like token
                    const token = btoa(JSON.stringify({
                        id: user.id,
                        username: user.username,
                        fullName: user.fullName,
                        role: user.role,
                        department: user.department,
                        email: user.email,
                        permissions: user.permissions,
                        exp: Date.now() + (24 * 60 * 60 * 1000) // 24 hours
                    }));

                    // Store token
                    localStorage.setItem('library_token', token);
                    localStorage.setItem('library_user', JSON.stringify(user));

                    // Show success
                    showAlert('تم تسجيل الدخول بنجاح! جاري التوجيه...', 'success');

                    // Redirect after delay
                    setTimeout(() => {
                        redirectToDashboard(user.role);
                    }, 1000);
                } else {
                    // Show error
                    showAlert('اسم المستخدم أو كلمة المرور غير صحيحة', 'danger');
                    loginBtn.disabled = false;
                    loadingSpinner.style.display = 'none';
                }
            }, 1500);

            return false;
        }

        function redirectToDashboard(role) {
            const dashboardMap = {
                'admin': 'admin-dashboard.html',
                'librarian': 'librarian-dashboard.html',
                'member': 'member-dashboard.html'
            };

            const dashboard = dashboardMap[role] || 'member-dashboard.html';
            window.location.href = dashboard;
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type}`;
            alertBox.innerHTML = `<i class="ti ti-${type === 'success' ? 'check' : 'alert-circle'}"></i> ${message}`;
            alertBox.style.display = 'block';
            
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        function showForgotPassword() {
            showAlert('يرجى التواصل مع مدير النظام: admin@alhusseini-library.com', 'info');
        }

        // Auto-fill on role card click
        document.querySelectorAll('.role-card').forEach(card => {
            card.addEventListener('click', function() {
                const role = this.dataset.role;
                const user = libraryUsers.find(u => u.role === role);
                if (user) {
                    document.getElementById('username').value = user.username;
                    document.getElementById('password').value = user.password;
                }
            });
        });

        // Enter key support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
